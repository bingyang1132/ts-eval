[project]
name = "ts-single-step"
description = "One Twilight Struggle decision per example, scored against a learned value oracle (ts-env)"
tags = ["games", "strategy", "single-turn", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.3.1",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ts_single_step.py", "pyproject.toml", "data/*.jsonl"]

[tool.verifiers.eval]
num_examples = 200
rollouts_per_example = 1
